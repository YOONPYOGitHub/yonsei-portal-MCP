name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Fork PRs never receive write permissions or repository secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DOTENV_DISABLED: "1"
  RUN_LIVE_PORTAL: "0"
  RUN_LIVE_LLM: "0"
  UV_PYTHON_DOWNLOADS: never

jobs:
  runtime-dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.26"
          enable-cache: false
      - name: Export exact locked runtime dependencies, without installing project code
        run: >-
          uv export --locked --no-dev --no-default-groups --no-emit-project
          --format requirements.txt --output-file "$RUNNER_TEMP/runtime-requirements.txt"
      - name: Audit pinned runtime dependencies
        # Public PyPI advisories only: no portal, LLM, or account access.
        run: >-
          uv tool run --python 3.11 --from pip-audit==2.9.0 pip-audit
          --requirement "$RUNNER_TEMP/runtime-requirements.txt"
          --require-hashes --disable-pip --strict --progress-spinner off

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified official Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # From the official v8.30.1 gitleaks_8.30.1_checksums.txt release asset.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version
      - name: Scan complete Git history (redacted)
        run: >-
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git .
          --log-opts="--all" --redact=100 --no-banner --exit-code 1
      - name: Scan current public files (redacted)
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          # Export the exact checked-out public tree, never local .env/cookies.
          mkdir -p "$RUNNER_TEMP/public-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/public-tree"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir "$RUNNER_TEMP/public-tree" \
            --redact=100 --no-banner --exit-code 1
      # Intentionally no uploaded reports, logs, or potentially sensitive artifacts.
