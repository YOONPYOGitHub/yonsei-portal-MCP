name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    defaults:
      run:
        # Git Bash on Windows drives native setup-python/uv, not WSL.
        shell: bash
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      PYTHON_DOTENV_DISABLED: "1"
      RUN_LIVE_PORTAL: "0"
      RUN_LIVE_LLM: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python "$PYTHON_VERSION"
      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Install native Chromium on macOS and Windows
        if: runner.os != 'Linux'
        run: uv run --no-sync playwright install chromium
      - name: Static error checks (no style rewrite)
        run: uv tool run --from ruff==0.14.1 ruff check --no-cache src tests --select E9,F63,F7,F82
      - name: Offline regression tests
        run: uv run --offline --no-sync python -m pytest -m "not live and not llm" -q --tb=short
      - name: Build distributions
        run: uv build --out-dir "$RUNNER_TEMP/dist"
      - name: Install wheel outside the source tree
        run: |
          set -euo pipefail
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/wheel-env"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            wheel_python="$RUNNER_TEMP/wheel-env/Scripts/python.exe"
          else
            wheel_python="$RUNNER_TEMP/wheel-env/bin/python"
          fi
          wheels=("$RUNNER_TEMP"/dist/*.whl)
          [[ ${#wheels[@]} -eq 1 && -f "${wheels[0]}" ]]
          uv pip install --python "$wheel_python" "${wheels[0]}[dev]"
          cd "$RUNNER_TEMP"
          "$wheel_python" -I - <<'PY'
          import sys
          from pathlib import Path
          import yonsei_portal_mcp
          assert Path(yonsei_portal_mcp.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          PY
          # A real config file works on every OS; /dev/null does not.
          printf '[pytest]\nasyncio_mode = auto\n' > wheel-pytest.ini
          "$wheel_python" -I -m pytest -c "$RUNNER_TEMP/wheel-pytest.ini" -p no:cacheprovider --import-mode=importlib "$GITHUB_WORKSPACE/tests/test_packaging.py" "$GITHUB_WORKSPACE/tests/test_public_metadata.py" -q --tb=short
