[project]
name = "yonsei-portal-mcp"
version = "0.3.0"
description = "연세대학교 포털/LearnUs/도서관 조회용 MCP 서버 (read-only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "yonsei", "learnus", "library", "playwright", "llm"]
authors = [{ name = "yoonpyohong" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Natural Language :: Korean",
]
dependencies = [
    "mcp>=1.2.0",
    "playwright>=1.44.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "certifi>=2024.2.2",
]

[project.urls]
Repository = "https://github.com/YOONPYOGitHub/yonsei-portal-MCP"
Issues = "https://github.com/YOONPYOGitHub/yonsei-portal-MCP/issues"

[project.scripts]
yonsei-portal-mcp = "yonsei_portal_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yonsei_portal_mcp"]
artifacts = ["src/yonsei_portal_mcp/_certs/*.pem"]
