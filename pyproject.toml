[project]
name = "yonsei-portal-mcp"
version = "0.5.0b2"
description = "연세대학교 포털/LearnUs/도서관 조회용 MCP 서버 (read-only)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "yonsei", "learnus", "library", "playwright", "llm"]
authors = [{ name = "yoonpyohong" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Natural Language :: Korean",
]
dependencies = [
    "anyio>=4.14.2,<5",
    "mcp>=1.28.1,<2",
    "jsonschema>=4.20,<5",
    "playwright>=1.44.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "certifi>=2024.2.2",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.24,<2",
]
# Real-LLM integration test harness (tests/llm). `anthropic` is lazy-imported,
# so it is only needed when LLM_PROVIDER=anthropic.
llm = [
    "openai>=1.82",
    "anthropic>=0.40",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Repository = "https://github.com/YOONPYOGitHub/yonsei-portal-MCP"
Issues = "https://github.com/YOONPYOGitHub/yonsei-portal-MCP/issues"
Documentation = "https://github.com/YOONPYOGitHub/yonsei-portal-MCP/blob/main/README.md"

[project.scripts]
yonsei-portal-mcp = "yonsei_portal_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yonsei_portal_mcp"]
artifacts = ["src/yonsei_portal_mcp/_certs/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "llm: requires a real LLM provider (skipped when no API key is configured)",
    "live: hits the real Yonsei portal AND a real LLM (opt-in via RUN_LIVE_LLM=1)",
]
